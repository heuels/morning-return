<title>Morning Routine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one reading column of labelled lists; each PR row carries GitHub's own state as chips. */
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --fg: #172030;
    --muted: #586477;
    --line: #dbe0e8;
    --accent: #2a55c6;
    --ok: #1b6d45;
    --ok-bg: #e2f2e9;
    --warn: #865100;
    --warn-bg: #faeed7;
    --bad: #a8291e;
    --bad-bg: #fae4e1;
    --chip-bg: #e9edf3;
    --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
    --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131a;
      --surface: #161d27;
      --fg: #e4e9f1;
      --muted: #97a2b4;
      --line: #263142;
      --accent: #86a6ff;
      --ok: #5fcf96;
      --ok-bg: #12301f;
      --warn: #f2b155;
      --warn-bg: #3a2a0e;
      --bad: #ff8a7d;
      --bad-bg: #3d1915;
      --chip-bg: #1f2835;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131a;
    --surface: #161d27;
    --fg: #e4e9f1;
    --muted: #97a2b4;
    --line: #263142;
    --accent: #86a6ff;
    --ok: #5fcf96;
    --ok-bg: #12301f;
    --warn: #f2b155;
    --warn-bg: #3a2a0e;
    --bad: #ff8a7d;
    --bad-bg: #3d1915;
    --chip-bg: #1f2835;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .brief {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 36px 72px;
    display: grid;
    gap: 32px;
  }
  header { display: grid; gap: 4px; }
  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font: 600 2.25rem/1.1 var(--font-display);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .tally { margin: 4px 0 0; color: var(--muted); font-size: 1rem; }
  section, .notes { display: grid; gap: 10px; min-width: 0; }
  h2 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h3 { margin: 8px 0 0; font-size: 0.95rem; font-weight: 600; }
  .lede { margin: 0; font-size: 1.05rem; max-width: 65ch; }
  .quiet { margin: 0; color: var(--muted); }

  .rows {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .rows > li {
    display: grid;
    gap: 6px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    min-width: 0;
  }
  .rows > li:first-child { border-top: 0; }
  .pr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .ref {
    font: 500 0.78rem/1.4 var(--font-mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .title a, .agenda a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .title a:hover, .agenda a:hover { color: var(--accent); text-decoration-color: currentColor; }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .byline { color: var(--muted); font-size: 0.85rem; }
  .summary { margin: 0; max-width: 65ch; }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip {
    font-size: 0.75rem;
    line-height: 1.6;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--muted);
  }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .diff { font: 0.75rem var(--font-mono); font-variant-numeric: tabular-nums; margin-left: auto; }
  .diff .add { color: var(--ok); }
  .diff .del { color: var(--bad); }

  details.review summary, details.team summary {
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
  }
  details.review summary { font-weight: 600; }
  details.review.verdict-blocking summary { color: var(--bad); }
  details.review.verdict-needs-work summary { color: var(--warn); }
  details.review.verdict-ship-ready summary { color: var(--ok); }
  details.team { display: grid; gap: 8px; }
  details.team[open] summary { margin-bottom: 8px; }
  details.review pre {
    margin: 8px 0 0;
    padding: 12px;
    max-height: 480px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 0.78rem/1.55 var(--font-mono);
    background: var(--bg);
    border-radius: 8px;
  }

  .agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .agenda li { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .when { min-width: 9.5rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .source-error, .banner { margin: 0; padding: 10px 14px; border-radius: 8px; }
  .source-error { background: var(--bad-bg); color: var(--bad); }
  .banner { background: var(--warn-bg); color: var(--warn); font-weight: 500; }
  .notes ul { margin: 0; padding-left: 1.2em; color: var(--muted); }
</style>

<main id="app">
  <div class="brief empty">
    <header>
      <p class="eyebrow">Morning routine</p>
      <h1>Your morning brief</h1>
    </header>
    <p class="lede">Loading today's PRs, Slack, mail and calendar.</p>
  </div>
</main>
<script type="module" src="app.js"></script>
